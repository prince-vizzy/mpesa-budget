name: mpesa_tracker
description: A Flutter application for M-Pesa tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3
  provider: ^6.1.1 # Ensure provider is still here
  flutter_launcher_icons: ^0.13.1
  intl: ^0.20.2
  uuid: ^4.4.0
  permission_handler: ^12.0.1
  collection: ^1.17.1
  fl_chart: ^1.2.0
  device_preview: ^1.3.1
  flutter_local_notifications: ^17.1.2
 
  

  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/background.jpg
    - assets/bg_swirl.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png