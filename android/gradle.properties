org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Pin the Gradle daemon to JDK 17.
#
# Gradle 8.14 embeds Kotlin 2.0.21 to compile the .gradle.kts build scripts, and
# that compiler crashes parsing a "25.0.1" java.version string. With a JDK 25
# JAVA_HOME the whole build fails with a bare "25.0.1" as the error message.
#
# This path is machine-specific -- point it at wherever your JDK 17 lives.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot
